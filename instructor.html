<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IT-221 Class Record</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a class-record ledger — sticky control bar, summary strip, then one wide scrollable grade table per view; row click opens a student sheet. */
:root {
  --bg: #f3f5f4;
  --panel: #ffffff;
  --ink: #17221f;
  --muted: #5a6a65;
  --line: #d6dedb;
  --line-soft: #e7ecea;
  --accent: #0f6b5c;
  --accent-soft: #e0f0ec;
  --pass: #1d7a3e;
  --pass-bg: #e3f3e8;
  --fail: #b3261e;
  --fail-bg: #fbe6e4;
  --warn: #9a5b00;
  --warn-bg: #fdf0d9;
  --head: #eef2f0;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --panel: #18211e; --ink: #e4ece9; --muted: #98aaa4; --line: #2d3a36; --line-soft: #23302c;
  --accent: #5cc4ae; --accent-soft: #1b3a33; --pass: #6fd08f; --pass-bg: #1a3324; --fail: #ff8a80; --fail-bg: #3d1d1b;
  --warn: #f2b45a; --warn-bg: #3a2c14; --head: #1d2824; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --panel: #18211e; --ink: #e4ece9; --muted: #98aaa4; --line: #2d3a36; --line-soft: #23302c;
  --accent: #5cc4ae; --accent-soft: #1b3a33; --pass: #6fd08f; --pass-bg: #1a3324; --fail: #ff8a80; --fail-bg: #3d1d1b;
  --warn: #f2b45a; --warn-bg: #3a2c14; --head: #1d2824; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* lock screen */
.lock { min-height: 80vh; display: grid; place-items: center; padding-block: 40px; }
.lock-card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; display: grid; gap: 16px; }
.lock-card h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }
.eyebrow { font-family: var(--font-data); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lock-card p { margin: 0; color: var(--muted); }
.lock-card label { font-weight: 600; font-size: 0.9rem; }
.lock-card input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--font-data); }
.btn { border: 0; border-radius: 6px; padding: 10px 16px; background: var(--accent); color: var(--panel); font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: 0.6; cursor: wait; }
.err { color: var(--fail); font-size: 0.9rem; min-height: 1.3em; }

/* header + controls */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { display: grid; gap: 2px; min-width: 0; }
.brand h1 { font-size: 1.2rem; font-weight: 800; }
.brand span { color: var(--muted); font-size: 0.85rem; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.ctl { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-size: 0.9rem; }
#q { width: 210px; max-width: 100%; }
.lockbtn { border: 1px solid var(--line); background: none; border-radius: 7px; padding: 7px 10px; cursor: pointer; font-size: 0.85rem; color: var(--muted); }

main { padding-block: 20px 48px; display: grid; gap: 20px; }
.meta { color: var(--muted); font-size: 0.9rem; }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tile { background: var(--panel); padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { font-size: 0.76rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 0.82rem; color: var(--muted); }
.tile.bad .v { color: var(--fail); } .tile.good .v { color: var(--pass); } .tile.warnt .v { color: var(--warn); }

/* section block */
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.block-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.block-head h2 { font-size: 1.05rem; font-weight: 700; }
.block-head .meta { font-size: 0.85rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; text-align: left; }
thead th { background: var(--head); font-weight: 600; font-size: 0.78rem; color: var(--muted); position: sticky; top: 0; }
thead tr.grp th { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; color: var(--accent); border-bottom: 1px solid var(--line); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
td.num, th.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td.name { font-weight: 600; position: sticky; left: 0; background: var(--panel); min-width: 200px; }
thead th.name { position: sticky; left: 0; z-index: 2; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--accent-soft); }
td .miss { color: var(--fail); font-weight: 600; }
td.grade { font-weight: 700; }
td.grade.f { color: var(--fail); }
th.sep, td.sep { border-left: 1px solid var(--line); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; font-family: var(--font-body); }
.pill.p { background: var(--pass-bg); color: var(--pass); }
.pill.f { background: var(--fail-bg); color: var(--fail); }
.pill.w { background: var(--warn-bg); color: var(--warn); }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.82rem; color: var(--muted); }
.legend b { color: var(--fail); }

/* student sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 20, 17, 0.45); z-index: 20; display: flex; justify-content: flex-end; }
.sheet { width: min(640px, 100%); height: 100%; overflow-y: auto; background: var(--panel); padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 18px; align-content: start; border-left: 1px solid var(--line); }
.sheet-top { display: flex; gap: 12px; align-items: start; justify-content: space-between; }
.sheet h2 { font-size: 1.3rem; font-weight: 800; }
.sheet .close { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.sheet h3 { font-size: 0.95rem; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.sheet table { font-size: 0.86rem; }
.sheet td, .sheet th { white-space: normal; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kv div { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.kv .k { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.kv .v { font-family: var(--font-data); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
@media (max-width: 720px) { .controls { margin-left: 0; } #q { width: 100%; } }
@media (prefers-reduced-motion: no-preference) { tbody tr td { transition: background 0.12s; } }
</style>
</head>
<body>


<div id="lock" class="wrap lock">
  <form class="lock-card" id="unlock" autocomplete="off">
    <span class="eyebrow">Instructor access</span>
    <h1>IT-221 Class Record</h1>
    <p>Quantitative Methods · BSIT 21C1, 21B1 and 21A1 · 1st Semester, A.Y. 2026 – 2027</p>
    <label for="pass">Instructor passcode</label>
    <input id="pass" type="password" required autofocus>
    <button class="btn" id="unlockBtn" type="submit">Open class record</button>
    <div class="err" id="lockErr" role="status" aria-live="polite"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <h1>IT-221 Class Record</h1>
        <span>Quantitative Methods · E.R. Borja · 1st Sem, A.Y. 2026 – 2027</span>
      </div>
      <div class="controls">
        <div class="seg" id="secSeg" role="group" aria-label="Section"></div>
        <div class="seg" id="perSeg" role="group" aria-label="Grading period"></div>
        <select id="filter" class="ctl" aria-label="Show">
          <option value="all">All students</option>
          <option value="failed">Failed only</option>
          <option value="missing">With missing work</option>
        </select>
        <input id="q" class="ctl" type="search" placeholder="Search name or student no." aria-label="Search students">
        <button class="lockbtn" id="relock" type="button">Lock</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>
<div id="sheetHost"></div>

const SECTIONS = ["BSIT 21C1", "BSIT 21B1", "BSIT 21A1"];
const PERIODS = { both: "Prelim & Midterm", prelim: "Prelim", midterm: "Midterm" };
let RECS = [], state = { sec: "all", per: "both", filter: "all", q: "", sort: "name", dir: 1 };
try { const s = JSON.parse(localStorage.getItem("it221-instr") || "{}"); Object.assign(state, s, { q: "" }); } catch (e) {}
const save = () => { try { localStorage.setItem("it221-instr", JSON.stringify({ sec: state.sec, per: state.per, filter: state.filter })); } catch (e) {} };

const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f2 = (x) => (x == null ? "—" : x.toFixed(2));
const pct = (it) => ((it.s ?? 0) / it.n) * 50 + 50;
const avg = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const short = (t) => t.replace("Laboratory Activity", "Lab").replace("Seatwork", "SW");
function calc(p) {
  if (!p || !p.exam) return null;
  const lab = avg(p.lab.map(pct)), quiz = avg(p.quiz.map(pct)), sw = avg(p.sw.map(pct));
  const cp = (lab + quiz + sw) / 3, cp60 = cp * 0.6, ex40 = ((p.exam.s ?? 0) + 50) * 0.4;
  return { lab, quiz, sw, cp, cp60, ex40, grade: cp60 + ex40 };
}
function missing(p) {
  if (!p) return [];
  const m = [...p.lab, ...p.quiz, ...p.sw].filter(i => i.s == null).map(i => short(i.t));
  if (p.exam && p.exam.s == null) m.push("Exam");
  return m;
}
const remark = (g) => g == null ? '<span class="pill w">In progress</span>' : g >= 75 ? '<span class="pill p">Passed</span>' : '<span class="pill f">Failed</span>';
const raw = (it) => it.s == null ? '<span class="miss">0</span>' : esc(it.s);

function enrich(r) {
  r._p = calc(r.prelim); r._m = calc(r.midterm);
  r._missP = missing(r.prelim); r._missM = missing(r.midterm);
  return r;
}

function visible(sec) {
  const q = state.q.trim().toLowerCase();
  return RECS.filter(r => r.section === sec).filter(r => {
    if (q && !(r.name.toLowerCase().includes(q) || r.studentNo.includes(q))) return false;
    const gs = state.per === "prelim" ? [r._p] : state.per === "midterm" ? [r._m] : [r._p, r._m];
    const ms = state.per === "prelim" ? r._missP : state.per === "midterm" ? r._missM : [...r._missP, ...r._missM];
    if (state.filter === "failed" && !gs.some(g => g && g.grade < 75)) return false;
    if (state.filter === "missing" && !ms.length) return false;
    return true;
  }).sort((a, b) => {
    const key = (r) => state.sort === "name" ? r.name : state.sort === "prelim" ? (r._p?.grade ?? -1) : state.sort === "midterm" ? (r._m?.grade ?? -1) : (r._missP.length + r._missM.length);
    const ka = key(a), kb = key(b);
    return (ka < kb ? -1 : ka > kb ? 1 : 0) * state.dir;
  });
}

function summary(rows) {
  const tiles = [];
  const stats = (k) => {
    const gs = rows.map(r => r[k]).filter(Boolean).map(c => c.grade);
    return { n: gs.length, pass: gs.filter(g => g >= 75).length, fail: gs.filter(g => g < 75).length, avg: gs.length ? avg(gs) : null };
  };
  tiles.push(`<div class="tile"><span class="k">Students</span><span class="v">${rows.length}</span><span class="s">${state.sec === "all" ? "All three sections" : esc(state.sec)}</span></div>`);
  const pers = state.per === "both" ? [["_p", "Prelim"], ["_m", "Midterm"]] : [[state.per === "prelim" ? "_p" : "_m", PERIODS[state.per]]];
  for (const [k, label] of pers) {
    const s = stats(k);
    tiles.push(`<div class="tile"><span class="k">${label} average</span><span class="v">${f2(s.avg)}</span><span class="s">${s.pass} passed · ${s.fail} failed</span></div>`);
    tiles.push(`<div class="tile ${s.fail ? "bad" : "good"}"><span class="k">${label} failing</span><span class="v">${s.fail}</span><span class="s">below 75.00</span></div>`);
  }
  const mk = state.per === "prelim" ? ["_missP"] : state.per === "midterm" ? ["_missM"] : ["_missP", "_missM"];
  const withMiss = rows.filter(r => mk.some(k => r[k].length)).length;
  const items = rows.reduce((a, r) => a + mk.reduce((b, k) => b + r[k].length, 0), 0);
  tiles.push(`<div class="tile warnt"><span class="k">Missing work</span><span class="v">${items}</span><span class="s">across ${withMiss} students</span></div>`);
  return `<div class="summary">${tiles.join("")}</div>`;
}

function sortTh(key, label, cls = "") {
  const arrow = state.sort === key ? (state.dir === 1 ? " ▲" : " ▼") : "";
  return `<th class="sortable ${cls}" data-sort="${key}" scope="col" aria-sort="${state.sort === key ? (state.dir === 1 ? "ascending" : "descending") : "none"}">${label}${arrow}</th>`;
}

function periodTable(sec, rows, per) {
  const sample = RECS.find(r => r.section === sec)[per];
  const items = [...sample.lab, ...sample.quiz, ...sample.sw];
  const k = per === "prelim" ? "_p" : "_m";
  const nL = sample.lab.length, nQ = sample.quiz.length, nS = sample.sw.length;
  const head = `<thead><tr class="grp"><th class="name"></th><th></th>
      <th class="sep" colspan="${nL}">Laboratory</th><th class="sep" colspan="${nQ}">Quizzes</th><th class="sep" colspan="${nS}">Seatwork</th>
      <th class="sep" colspan="4">Class performance (60%)</th><th class="sep" colspan="2">Major exam (40%)</th><th class="sep" colspan="2"></th></tr>
    <tr>${sortTh("name", "Name", "name")}<th scope="col">Student no.</th>
      ${items.map((it, i) => `<th class="num ${i === 0 || i === nL || i === nL + nQ ? "sep" : ""}" scope="col">${esc(short(it.t))}<br>/${it.n}</th>`).join("")}
      <th class="num sep">Lab</th><th class="num">Quiz</th><th class="num">SW</th><th class="num">CP 60%</th>
      <th class="num sep">Exam<br>/${sample.exam.n}</th><th class="num">ME 40%</th>
      ${sortTh(per, "Grade", "num sep")}<th scope="col">Remarks</th></tr></thead>`;
  const body = rows.map(r => {
    const p = r[per], c = r[k];
    const its = [...p.lab, ...p.quiz, ...p.sw];
    return `<tr data-id="${esc(r.studentNo)}" tabindex="0"><td class="name">${esc(r.name)}</td><td class="num">${esc(r.studentNo)}</td>
      ${its.map((it, i) => `<td class="num ${i === 0 || i === nL || i === nL + nQ ? "sep" : ""}">${raw(it)}</td>`).join("")}
      <td class="num sep">${f2(c?.lab)}</td><td class="num">${f2(c?.quiz)}</td><td class="num">${f2(c?.sw)}</td><td class="num">${f2(c?.cp60)}</td>
      <td class="num sep">${raw(p.exam)}</td><td class="num">${f2(c?.ex40)}</td>
      <td class="num grade sep ${c && c.grade < 75 ? "f" : ""}">${f2(c?.grade)}</td><td>${remark(c?.grade)}</td></tr>`;
  }).join("");
  return `<table>${head}<tbody>${body}</tbody></table>`;
}

function bothTable(rows) {
  const head = `<thead><tr>${sortTh("name", "Name", "name")}<th>Student no.</th>
    <th class="num sep">Prelim CP</th><th class="num">Prelim ME</th>${sortTh("prelim", "Prelim grade", "num")}<th>Prelim</th>
    <th class="num sep">Midterm CP</th><th class="num">Midterm ME</th>${sortTh("midterm", "Midterm grade", "num")}<th>Midterm</th>
    ${sortTh("miss", "Missing work", "sep")}</tr></thead>`;
  const body = rows.map(r => {
    const m = [...r._missP.map(x => "P: " + x), ...r._missM.map(x => "M: " + x)];
    return `<tr data-id="${esc(r.studentNo)}" tabindex="0"><td class="name">${esc(r.name)}</td><td class="num">${esc(r.studentNo)}</td>
      <td class="num sep">${f2(r._p?.cp60)}</td><td class="num">${f2(r._p?.ex40)}</td><td class="num grade ${r._p && r._p.grade < 75 ? "f" : ""}">${f2(r._p?.grade)}</td><td>${remark(r._p?.grade)}</td>
      <td class="num sep">${f2(r._m?.cp60)}</td><td class="num">${f2(r._m?.ex40)}</td><td class="num grade ${r._m && r._m.grade < 75 ? "f" : ""}">${f2(r._m?.grade)}</td><td>${remark(r._m?.grade)}</td>
      <td class="sep">${m.length ? `<span class="pill w">${m.length}</span> <span class="meta">${esc(m.slice(0, 4).join(", "))}${m.length > 4 ? "…" : ""}</span>` : '<span class="meta">None</span>'}</td></tr>`;
  }).join("");
  return `<table>${head}<tbody>${body}</tbody></table>`;
}

function render() {
  document.querySelectorAll("#secSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state.sec)));
  document.querySelectorAll("#perSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === state.per)));
  document.getElementById("filter").value = state.filter;
  const secs = state.sec === "all" ? SECTIONS : [state.sec];
  const all = secs.flatMap(s => visible(s));
  let html = summary(all);
  html += `<div class="legend"><span>Red <b>0</b> = not submitted</span><span>Plain 0 = submitted, no valid answer</span><span>Click a student for the full record</span><span>Click a column heading with ▲▼ to sort</span></div>`;
  for (const s of secs) {
    const rows = visible(s); const r0 = RECS.find(r => r.section === s);
    html += `<section class="block"><div class="block-head"><h2>${esc(s)}</h2><span class="meta">${esc(r0.schedule)} · Room ${esc(r0.room)} · ${rows.length} shown</span></div>`;
    if (!rows.length) { html += `<div class="empty">No students match these filters.</div></section>`; continue; }
    html += `<div class="scroll">${state.per === "both" ? bothTable(rows) : periodTable(s, rows, state.per)}</div></section>`;
  }
  document.getElementById("main").innerHTML = html;
}

function sheet(r) {
  const block = (per, label, c, miss) => {
    const p = r[per];
    const rows = [["Laboratory", p.lab, c?.lab], ["Quizzes", p.quiz, c?.quiz], ["Seatwork", p.sw, c?.sw]].map(([g, its, a]) =>
      its.map((it, i) => `<tr><td>${i === 0 ? `<strong>${g}</strong>` : ""}</td><td>${esc(it.t)}</td><td class="num">${it.s == null ? '<span class="miss">Not submitted</span>' : `${esc(it.s)} / ${it.n}`}</td><td class="num">${pct(it).toFixed(2)}</td></tr>`).join("")
      + `<tr><td></td><td class="meta">${g} grade</td><td></td><td class="num"><strong>${f2(a)}</strong></td></tr>`).join("");
    const ex = p.exam ? `<tr><td><strong>Major exam</strong></td><td>${esc(p.exam.t)}</td><td class="num">${p.exam.s == null ? '<span class="miss">Not submitted</span>' : `${esc(p.exam.s)} / ${p.exam.n}`}</td><td class="num">${((p.exam.s ?? 0) + 50).toFixed(2)}</td></tr>` : "";
    return `<div><h3>${label} ${remark(c?.grade)}</h3></div>
      <div class="kv"><div><div class="k">CP (60%)</div><div class="v">${f2(c?.cp60)}</div></div><div><div class="k">ME (40%)</div><div class="v">${f2(c?.ex40)}</div></div><div><div class="k">${label} grade</div><div class="v">${f2(c?.grade)}</div></div><div><div class="k">Missing</div><div class="v">${miss.length}</div></div></div>
      <div class="scroll"><table><thead><tr><th>Category</th><th>Requirement</th><th class="num">Raw score</th><th class="num">%</th></tr></thead><tbody>${rows}${ex}</tbody></table></div>`;
  };
  const host = document.getElementById("sheetHost");
  host.innerHTML = `<div class="sheet-bg" id="sheetBg"><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-top"><div><span class="eyebrow">${esc(r.section)} · ${esc(r.studentNo)}</span><h2 id="sheetTitle">${esc(r.name)}</h2><div class="meta">${esc(r.schedule)} · Room ${esc(r.room)}</div></div>
    <button class="close" id="closeSheet" type="button">Close</button></div>
    ${block("prelim", "Preliminary Period", r._p, r._missP)}
    ${block("midterm", "Midterm Period", r._m, r._missM)}
  </aside></div>`;
  const close = () => { host.innerHTML = ""; };
  document.getElementById("closeSheet").onclick = close;
  document.getElementById("sheetBg").onclick = (e) => { if (e.target.id === "sheetBg") close(); };
  document.getElementById("closeSheet").focus();
}

function boot() {
  const ss = document.getElementById("secSeg");
  ss.innerHTML = [["all", "All"], ...SECTIONS.map(s => [s, s.replace("BSIT ", "")])].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("");
  const ps = document.getElementById("perSeg");
  ps.innerHTML = Object.entries(PERIODS).map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("");
  ss.onclick = (e) => { const b = e.target.closest("button"); if (b) { state.sec = b.dataset.v; save(); render(); } };
  ps.onclick = (e) => { const b = e.target.closest("button"); if (b) { state.per = b.dataset.v; if (!["name", "miss", state.per].includes(state.sort) && state.per !== "both") state.sort = "name"; save(); render(); } };
  document.getElementById("filter").onchange = (e) => { state.filter = e.target.value; save(); render(); };
  document.getElementById("q").oninput = (e) => { state.q = e.target.value; render(); };
  const main = document.getElementById("main");
  main.addEventListener("click", (e) => {
    const th = e.target.closest("th[data-sort]");
    if (th) { const k = th.dataset.sort; state.dir = state.sort === k ? -state.dir : (k === "name" ? 1 : -1); state.sort = k; render(); return; }
    const tr = e.target.closest("tr[data-id]"); if (tr) sheet(RECS.find(r => r.studentNo === tr.dataset.id));
  });
  main.addEventListener("keydown", (e) => { if (e.key === "Enter") { const tr = e.target.closest("tr[data-id]"); if (tr) sheet(RECS.find(r => r.studentNo === tr.dataset.id)); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("sheetHost").innerHTML = ""; });
  document.getElementById("relock").onclick = () => { RECS = []; document.getElementById("main").innerHTML = ""; document.getElementById("app").hidden = true; document.getElementById("lock").hidden = false; document.getElementById("pass").value = ""; };
  render();
}

document.getElementById("unlock").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("unlockBtn"), err = document.getElementById("lockErr");
  const pass = document.getElementById("pass").value.trim();
  err.textContent = ""; btn.disabled = true; btn.textContent = "Opening…";
  try {
    if (!window.crypto?.subtle) throw new Error("nocrypto");
    RECS = (await decrypt(pass)).map(enrich);
    document.getElementById("lock").hidden = true; document.getElementById("app").hidden = false;
    boot();
  } catch (x) {
    err.textContent = x.message === "nocrypto" ? "This browser can't open encrypted records. Use a recent Chrome, Safari, Edge or Firefox." : "That passcode didn't work. Check it and try again.";
  } finally { btn.disabled = false; btn.textContent = "Open class record"; }
});
</script>
